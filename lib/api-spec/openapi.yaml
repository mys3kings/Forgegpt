openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: forge
    description: AI website generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /forge/generate:
    post:
      operationId: generateForgeSite
      tags: [forge]
      summary: Generate a React website component
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateSiteInput"
      responses:
        "200":
          description: Generated React component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateSiteResponse"
        "400":
          description: Invalid prompt
        "502":
          description: Gemini generation failed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GenerateSiteInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 4000
      required:
        - prompt
    GenerateSiteResponse:
      type: object
      properties:
        code:
          type: string
      required:
        - code

